name: Native distribution and Node reference
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["ubuntu-24.04","ubuntu-24.04-arm","windows-2022","windows-11-arm","macos-15-intel","macos-15"]' || '["ubuntu-24.04","windows-2022","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.4'
      - run: |
          bun install --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          bun run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          bun run lint
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          bun test tests/core
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Compare Node/Bun corpus and validate native full exports
        run: |
          node tests/tooling/retirement-parity.mjs (Get-Command bun).Source retirement-parity.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: retirement-${{ matrix.os }}
          path: retirement-parity.json
      - name: Verify Lumi-free distribution, authoring, SDK clients and HTTP
        run: |
          npm ci --prefix tests/tooling --ignore-scripts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node tests/tooling/verify-toolchain.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $report=Get-Content retirement-parity.json -Raw | ConvertFrom-Json
          ./tests/tooling/package-probe.ps1 -Bun (Get-Command bun).Source -Libraries (Join-Path $report.artifacts 'data/libraries')
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify offline Typst source rendering on a Linux Docker engine
        if: github.event_name == 'workflow_dispatch' && matrix.os == 'ubuntu-24.04'
        run: |
          $env:H5P_TEST_TYPST_DOCKER='1'
          $env:H5P_MCP_TYPST_ENABLED='1'
          $env:H5P_MCP_TYPST_SANDBOX='docker'
          $env:H5P_MCP_TYPST_PACKAGES=Join-Path $env:RUNNER_TEMP 'typst-source-packages'
          docker pull ghcr.io/typst/typst@sha256:032e292249bcd378480cc7c142cfa324b63ef8aadeb88d7e7230320c4c9c422f
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          bun dist/core/cli.js figure setup $env:H5P_MCP_TYPST_PACKAGES
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          bun test tests/core/typst-sandbox.test.ts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node tests/tooling/typst-source-probe.mjs (Get-Command bun).Source dist/core/cli.js (Join-Path $env:RUNNER_TEMP 'typst-source-figures')
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Exercise optional managed Typst and local MCP on this host
        if: github.event_name == 'workflow_dispatch'
        run: |
          $report=Get-Content retirement-parity.json -Raw | ConvertFrom-Json
          $expected = @{
            'ubuntu-24.04' = 'linux-x64'; 'ubuntu-24.04-arm' = 'linux-arm64'
            'windows-2022' = 'win32-x64'; 'windows-11-arm' = 'win32-arm64'
            'macos-15-intel' = 'darwin-x64'; 'macos-15' = 'darwin-arm64'
          }['${{ matrix.os }}']
          $actual = bun -p 'process.platform + "-" + process.arch'
          "commit=$env:GITHUB_SHA runner=${{ matrix.os }} expected=$expected actual=$actual" | Tee-Object -FilePath typst-m1.log
          if ($LASTEXITCODE -or $actual -ne $expected) { throw "Unexpected Bun architecture: $actual" }
          node tests/tooling/typst-managed-probe.mjs (Get-Command bun).Source dist/core/cli.js (Join-Path $report.artifacts 'data/libraries') 2>&1 | Tee-Object -FilePath typst-m1.log -Append
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && github.event_name == 'workflow_dispatch'
        with:
          name: typst-m1-${{ matrix.os }}
          path: typst-m1.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: f4-source-${{ matrix.os }}
          path: docs/architecture/007-bun-mcp.md
